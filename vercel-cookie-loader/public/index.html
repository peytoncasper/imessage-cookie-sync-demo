<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Legacy SMS Handoff Demo</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { max-width: 38rem; margin: 8vh auto; padding: 0 1.25rem; line-height: 1.5; }
      form { display: grid; gap: 1rem; }
      label { display: grid; gap: .35rem; font-weight: 650; }
      input { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; }
      .check { display: flex; align-items: start; gap: .65rem; font-weight: 450; }
      .check input { width: auto; margin-top: .3rem; }
      button { padding: .8rem 1rem; font: inherit; font-weight: 700; cursor: pointer; }
      #result { min-height: 1.5rem; overflow-wrap: anywhere; }
      .note { color: color-mix(in srgb, CanvasText 68%, transparent); }
    </style>
  </head>
  <body>
    <h1>Legacy SMS handoff demo</h1>
    <p class="note">This experiment sends encrypted handoff links. The current native sign-in app requires a separately prepared sign-in card and does not open these links.</p>
    <p class="note">The administration secret stays in this tab and is not saved. Only text people who explicitly requested the link.</p>
    <form id="send-form">
      <label>Administration secret
        <input id="secret" type="password" autocomplete="off" required minlength="32">
      </label>
      <label>Recipient in E.164 format
        <input id="to" type="tel" autocomplete="tel" placeholder="+14155550123" required pattern="\+[1-9][0-9]{7,14}">
      </label>
      <label>HTTPS destination
        <input id="target" type="url" inputmode="url" placeholder="https://example.com/login" required>
      </label>
      <label class="check">
        <input id="consent" type="checkbox" required>
        <span>I confirm this recipient requested and consented to receive this text.</span>
      </label>
      <button type="submit">Send text</button>
      <output id="result" aria-live="polite"></output>
    </form>
    <script>
      const form = document.querySelector('#send-form');
      const result = document.querySelector('#result');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        result.textContent = 'Sending…';
        try {
          const response = await fetch('/api/texts', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${document.querySelector('#secret').value}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              to: document.querySelector('#to').value,
              targetUrl: document.querySelector('#target').value,
              consentConfirmed: document.querySelector('#consent').checked
            })
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error?.message || 'Unable to send the text.');
          result.textContent = `Queued as ${body.messageSid}. Link expires at ${body.expiresAt}.`;
        } catch (error) {
          result.textContent = error instanceof Error ? error.message : 'Unable to send the text.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
