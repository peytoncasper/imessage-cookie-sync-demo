name: CookieClipDemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  HNMessages:
    type: application.messages
    platform: iOS
    info:
      path: MessagesApp/Info.plist
      properties:
        CFBundleDisplayName: HN Login
        LSApplicationLaunchProhibited: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: HNMessagesExtension
    scheme: {}

  HNMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
      - Shared/MessageWebViewController.swift
      - Shared/WebViewMessageLink.swift
      - Shared/HackerNewsCookieCapture.swift
      - Shared/SignInCard.swift
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: HN Login
        CookieTransferBaseURL: https://$(BACKEND_DOMAIN)
        CookieTransferClientSecret: $(COOKIE_TRANSFER_CLIENT_SECRET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).MessagesExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    scheme: {}
