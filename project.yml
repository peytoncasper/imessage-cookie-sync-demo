name: CookieClipDemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  HNMessages:
    type: application.messages
    platform: iOS
    info:
      path: MessagesApp/Info.plist
      properties:
        CFBundleDisplayName: HN Login
        LSApplicationLaunchProhibited: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: HNMessagesExtension
    scheme: {}

  CookieClipHost:
    type: application
    platform: iOS
    sources:
      - Shared
      - Host
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Cookie Clip Demo
        CookieClipBaseURL: https://$(APP_CLIP_DOMAIN)
        CookieClipBundleIdentifier: $(APP_BUNDLE_IDENTIFIER).Clip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Host/CookieClipHost.entitlements
      properties:
        com.apple.developer.associated-domains:
          - appclips:$(APP_CLIP_DOMAIN)
          - applinks:$(APP_CLIP_DOMAIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: CookieClip
      - target: HNMessagesExtension
    scheme: {}

  HNMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - MessagesExtension
      - Shared/MessageWebViewController.swift
      - Shared/WebViewMessageLink.swift
      - Shared/HackerNewsCookieCapture.swift
      - Shared/AppClipInvocation.swift
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: HN Login
        CookieClipBaseURL: https://$(APP_CLIP_DOMAIN)
        CookieClipBundleIdentifier: $(APP_BUNDLE_IDENTIFIER).Clip
        CookieTransferClientSecret: $(COOKIE_TRANSFER_CLIENT_SECRET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).MessagesExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    scheme: {}

  CookieClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Shared
      - Clip
    info:
      path: Clip/Info.plist
      properties:
        CFBundleDisplayName: Cookie Clip
        CookieClipBaseURL: https://$(APP_CLIP_DOMAIN)
        CookieClipBundleIdentifier: $(APP_BUNDLE_IDENTIFIER).Clip
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
    entitlements:
      path: Clip/CookieClip.entitlements
      properties:
        com.apple.developer.associated-domains:
          - appclips:$(APP_CLIP_DOMAIN)
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).Clip
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme: {}
